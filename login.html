<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In | PantryPal</title>
  <meta name="description" content="Log in to PantryPal." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/pantrypal-app-icon.png" />
  <link rel="preconnect" href="https://api.openverse.org">
  <link rel="preconnect" href="https://commons.wikimedia.org">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="theme-08-playful-poster" data-page="login">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="PantryPal home">
      <img src="assets/pantrypal-nav-exact.png" alt="PantryPal logo" />
    </a>
<nav class="app-nav" aria-label="PantryPal navigation">
      <a href="index.html" data-page="home">Home</a>
      <a href="planner.html" data-page="planner">Planner</a>
      <a href="ingredients.html" data-page="ingredients">Ingredients</a>
      <a href="recipes.html" data-page="recipes">Recipes</a>
      <a href="my-recipes.html" data-page="my-recipes">My Recipes</a>
      <a href="groceries.html" data-page="groceries">Groceries</a>
      <a href="favorites.html" data-page="favorites">Favorites</a>
      <a href="case-study.html" data-page="case-study">Case Study</a>
      <a href="articles.html" data-page="articles">Articles</a>
    </nav>
    <div class="account-nav" data-auth-nav></div>
  </header>
  <main class="auth-page">
    <div class="auth-brand-logo"><img src="assets/pantrypal-logo-wide.png" alt="PantryPal" /></div>
    <section class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in to PantryPal</h1>
      <p>Open your saved PantryPal data on this device.</p>
      <form id="loginForm" class="auth-form">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required minlength="6"></label>
        <p id="authMessage" class="auth-message" role="alert"></p>
        <button class="primary-button" type="submit">Log in</button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </section>
  </main>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const msg=document.getElementById('authMessage'); msg.textContent='';
      try { await PantryPalAuth.login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value); location.href='index.html'; }
      catch(err){ msg.textContent=err.message; }
    });
  </script>
</body>
</html>
